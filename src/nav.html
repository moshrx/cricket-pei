<script>
    // Highlight current page in navigation
    function setActiveNav() {
        const pageName = (window.location.pathname.split('/').pop() || 'index.html').replace('.html', '');

        // Desktop navigation
        const desktopNavContainer = document.querySelector('.hidden.md\\:flex');
        if (desktopNavContainer) {
            desktopNavContainer.querySelectorAll('[data-current]').forEach(link => {
                if (link.getAttribute('data-current') === pageName) {
                    link.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                } else {
                    link.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
                }
            });
        }

        // Mobile navigation
        const mobileNavContainer = document.getElementById('nav-links');
        if (mobileNavContainer) {
            mobileNavContainer.querySelectorAll('[data-current]').forEach(link => {
                if (link.getAttribute('data-current') === pageName) {
                    link.classList.add('text-blue-600');
                    link.classList.remove('border-b', 'border-gray-50');
                }
            });
        }
    }

    // Toggle mobile menu
    document.getElementById('menu-btn').onclick = () => {
        document.getElementById('nav-links').classList.toggle('hidden');
    };

    // Set active on page load
    document.addEventListener('DOMContentLoaded', setActiveNav);
</script>
