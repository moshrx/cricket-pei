<script>
    // Highlight current page in navigation
    function setActiveNav() {
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const pageName = currentPage.replace('.html', '');

        document.querySelectorAll('[data-current]').forEach(link => {
            if (link.getAttribute('data-current') === pageName) {
                link.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
            } else {
                link.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
            }
        });
    }

    // Toggle mobile menu
    document.getElementById('menu-btn').onclick = () => {
        document.getElementById('nav-links').classList.toggle('hidden');
    };

    // Set active on page load
    document.addEventListener('DOMContentLoaded', setActiveNav);
</script>
